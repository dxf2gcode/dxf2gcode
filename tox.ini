[tox]
env_list = fast, full
min_version = 4.0
package = skip

[testenv]
deps = -r{toxinidir}/requirements-test.txt
set_env =
    QT_QPA_PLATFORM = offscreen
    DXF2GCODE_QT = 5

[testenv:fast]
description = Fast regression checks for core import, geometry, export and persistence paths
commands = python {toxinidir}/tests/run_tests.py fast

[testenv:full]
description = Complete unittest suite, including the GUI and CLI integration tests
commands = python {toxinidir}/tests/run_tests.py full
