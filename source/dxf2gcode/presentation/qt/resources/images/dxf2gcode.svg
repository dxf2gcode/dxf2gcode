        <path d="M207 390 C225 377 243 385 259 405 C270 418 279 415 285 405 L285 426 C270 442 254 429 239 412 C228 399 216 400 207 409 Z"></path>
        <path d="M207 424 C225 411 243 419 259 439 C270 452 279 449 285 439 L285 460 C270 476 254 463 239 446 C228 433 216 434 207 443 Z"></path>
