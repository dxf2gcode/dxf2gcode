
<!--?xml version="1.0" encoding="UTF-8"?-->
<svg xmlns="http://www.w3.org/2000/svg" width="408" height="408" viewBox="149 99 408 408" preserveAspectRatio="xMidYMid meet">

  <title>DXF CAM Logo</title>
  <desc>
