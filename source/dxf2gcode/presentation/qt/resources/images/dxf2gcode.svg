  <!--
    Cyanfarbene Werkzeugbahn

    Mittelpunkt: (338,303)
    Radius Werkzeugbahn: 122
    Radius innere D-Kontur: 138

    Abstand der Mittellinien: 16
    Kuerzester Freiraum zwischen Punkt und Bogenende: 7

    Punktwinkel: 90, 70, 50, 30, 10, -10 Grad
    Punktradien: 12, 10, 8, 6, 4, 2
    Bogenbreiten: 20, 16.8, 13.6, 10.4, 7.2
  -->

  <g id="toolpath" stroke="#00D7E0" fill="none" stroke-linecap="butt">

    <!-- Gerade vor dem ersten Punkt -->
    <line id="entry-line" x1="292" y1="425" x2="319" y2="425" stroke-width="20"></line>

    <!-- Konzentrische Kreisbogenstücke -->
    <path d="M357 423.51141 A122 122 0 0 0 363.3446 422.33839" stroke-width="20"></path>

    <path d="M395.294149 410.709705 A122 122 0 0 0 404.33443 405.390153" stroke-width="16.8"></path>

    <path d="M427.315763 386.106524 A122 122 0 0 0 436.553558 374.91103" stroke-width="13.6"></path>

    <path d="M449.553558 352.39437 A122 122 0 0 0 455.747052 334.931675" stroke-width="10.4"></path>

    <path d="M459.567311 313.265904 A122 122 0 0 0 459.38201 290.735916" stroke-width="7.2"></path>
  </g>

  <!-- Punkte entlang der Werkzeugbahn -->
  <g id="toolpath-points" fill="#00D7E0">
    <circle cx="338" cy="425" r="12"></circle>
    <circle cx="379.726457" cy="417.6425" r="10"></circle>
    <circle cx="416.420088" cy="396.457422" r="8"></circle>
