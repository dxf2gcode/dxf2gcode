      <stop offset="17%" stop-color="#69747E"></stop>
      <stop offset="38%" stop-color="#F1F4F6"></stop>
      <stop offset="54%" stop-color="#9AA5AE"></stop>
      <stop offset="72%" stop-color="#3E4852"></stop>
      <stop offset="89%" stop-color="#C9D1D7"></stop>
      <stop offset="100%" stop-color="#1A2027"></stop>
    </linearGradient>

    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#17151C"></stop>
      <stop offset="22%" stop-color="#54404B"></stop>
      <stop offset="43%" stop-color="#C39A9C"></stop>
      <stop offset="57%" stop-color="#F1D1C8"></stop>
      <stop offset="73%" stop-color="#80616C"></stop>
      <stop offset="100%" stop-color="#191923"></stop>
    </linearGradient>

    <clipPath id="cutter-clip">
