    <path d="M177 203 L203 245 H283 L309 203 Z" fill="url(#steel)" stroke="#46535E" stroke-width="1"></path>

    <path d="M203 245 H283 V256 H203 Z" fill="url(#steel)" stroke="#46535E" stroke-width="0.8"></path>

    <path d="M215 256 H271 V285 H215 Z" fill="url(#steel)"></path>
