<svg xmlns="http://www.w3.org/2000/svg" width="4096" height="1300" viewBox="0 0 2048 650" role="img" aria-labelledby="title desc">
  <title id="title">DXF2Gcode â€” contour and toolpath logo</title>
  <desc id="desc">Red selected D and G contours, blue cutting paths, orange dashed cutter circles, drilling symbols and a green snake forming the numeral 2. The X exit arrow follows its descending diagonal.</desc>
  <style>
    .contour { fill: white; stroke: #000000; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    .selected { fill: white; stroke: #FF0000; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    .cut { fill: none; stroke: #3264FF; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .center { fill: none; stroke: #000000; stroke-width: 3; stroke-linecap: round; }
    .cutter { fill: none; stroke: #FF8C00; stroke-width: 5; stroke-dasharray: 8 7; stroke-linecap: round; }
    .entry { fill: none; stroke: #FF8C00; stroke-width: 5; stroke-dasharray: 7 8; stroke-linecap: round; }
    .exit { fill: none; stroke: #C83CC8; stroke-width: 5; stroke-dasharray: 7 8; stroke-linecap: round; }
  </style>
  <rect width="2048" height="650" fill="white"/>

