name: Fast regression tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  fast:
    name: Python 3.11 / PyQt5
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DXF2GCODE_QT: "5"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgl1

      - name: Install Python dependencies
        # Match the application's PyQt5 minimum as well as the test requirements.
        run: python -m pip install -r requirements-test.txt "PyQt5>=5.15"

      - name: Generate Qt5 UI and resources
        # Translation compilation is not needed by the fast suite.
        run: python source/tools/build/qt_assets.py

      - name: Run fast regression tests
        run: python tests/run_tests.py fast
