name: Documentation checks

on:
  push:
    branches: [develop, docs/zensical-prototype]
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'requirements-docs.txt'
      - '.github/workflows/documentation-*.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'requirements-docs.txt'
      - '.github/workflows/documentation-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install existing documentation requirements
        run: python -m pip install -r requirements-docs.txt
      - name: Build documentation without publishing
        run: python -m zensical build --strict
