name: Publish release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/package-checks.yml

  publish:
    name: Publish verified downloads and retain ten Develop releases
    needs: checks
    if: >-
      github.repository == 'dxf2gcode/dxf2gcode' &&
      vars.CI_RELEASES_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/publish
      - name: Create checksums for the exact downloaded files
        env:
          RELEASE_OUT: ${{ runner.temp }}/publish
        run: |
          PYTHONPATH=tools python - <<'PY'
          import os
          from release_policy import write_checksums
          write_checksums(os.environ['RELEASE_OUT'])
          PY
      - name: Publish complete draft and clean owned previews only after success
        run: python tools/publish_release.py '${{ runner.temp }}/publish'
